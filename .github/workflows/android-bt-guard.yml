name: BT-Wächter APK

on:
  push:
    branches: [claude/bt-waechter-app]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-bt-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Persist a signing key between builds so a new APK installs as an update
      # and keeps the app's database. The cache lapses after ~7 idle days; set
      # the repo secret BTGUARD_KEYSTORE_BASE64 to make the key truly permanent.
      - uses: actions/cache@v4
        with:
          path: ~/btguard-debug.keystore
          key: bt-waechter-debug-keystore-v2

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.BTGUARD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/btguard-debug.keystore"
            echo "Signing key: from repo secret (permanent)."
          elif [ -f "$HOME/btguard-debug.keystore" ]; then
            echo "Signing key: restored from cache."
          else
            keytool -genkeypair -noprompt \
              -keystore "$HOME/btguard-debug.keystore" -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
            echo "Signing key: newly generated (no cache, no secret)."
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          BTGUARD_DEBUG_KEYSTORE="$HOME/btguard-debug.keystore" ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk bt-waechter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bt-waechter-apk
          path: android-bt-guard/bt-waechter.apk

      # On a version tag (e.g. v1.1) publish a GitHub Release with the APK, so
      # there is a permanent, no-login download link.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **BT-Wächter** — überwacht Bluetooth-Verbindungen zu deinem Handy.

          Lade **bt-waechter.apk** unten herunter, öffne sie und bestätige die
          Installation aus dieser Quelle. Beim ersten Start alle Berechtigungen
          erteilen; im Tab **Schutz** „Überwachung im Hintergrund" auf
          „Nicht eingeschränkt" stellen.
          NOTES
          # Create the release if the tag push made it; if the release was
          # drafted in the web UI first, just attach/replace the APK instead.
          gh release create "${{ github.ref_name }}" bt-waechter.apk \
            --repo "${{ github.repository }}" \
            --title "BT-Wächter ${{ github.ref_name }}" \
            --notes-file notes.md \
          || gh release upload "${{ github.ref_name }}" bt-waechter.apk \
            --repo "${{ github.repository }}" --clobber
