name: Boom2Local APK

# The app is built here because the Android SDK is not reachable from the
# development container: maven.google.com redirects to dl.google.com, which the
# environment's network policy denies. GitHub's runners have the SDK, so this is
# also the first place the Android layer is genuinely compiled.

on:
  push:
    paths:
      - "soundcore-boom2-local/**"
      - ".github/workflows/boom2local.yml"
  workflow_dispatch:

permissions:
  # Needed to publish the APK as a release asset, which is the only download route
  # that works without a GitHub login and without unpacking a zip.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soundcore-boom2-local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The protocol core is plain Kotlin, so it is tested without the Android SDK.
      # It runs first: if the framing or the policy is broken, the APK is pointless.
      - name: Protocol core tests
        working-directory: soundcore-boom2-local/protocol-verify
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon check

      # One signing key for all builds, so a new APK installs as an update instead of
      # having to uninstall the old one (which would also drop its settings).
      - uses: actions/cache@v4
        with:
          path: ~/boom2local-debug.keystore
          key: boom2local-debug-keystore-v1

      - name: Create signing key on first run
        run: |
          [ -f ~/boom2local-debug.keystore ] || keytool -genkeypair -noprompt \
            -keystore ~/boom2local-debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Boom2Local Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      # assembleDebug produces the installable APK and runs the manifest and import
      # guards on the way. assembleRelease is built as well, not to ship it, but
      # because it is the only thing that exercises R8: the release build shrinks and
      # obfuscates, and kotlinx.serialization's generated serializers are reached
      # reflectively, so a wrong proguard rule only ever shows up here.
      - name: Build APK
        run: |
          chmod +x gradlew
          BOOM2_DEBUG_KEYSTORE="$HOME/boom2local-debug.keystore" \
            ./gradlew --no-daemon \
              :app:assembleDebug \
              :app:assembleRelease \
              :app:verifyDependencyAllowlist
          cp app/build/outputs/apk/debug/app-debug.apk boom2-local.apk

      # Proof, in the build log, that the shipped APK cannot reach the network.
      - name: Show the permissions the APK actually requests
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "--- uses-permission entries in boom2-local.apk ---"
          "$AAPT" dump permissions boom2-local.apk | sed -n '/permission/p'
          echo "--- checking for network permissions ---"
          if "$AAPT" dump permissions boom2-local.apk | grep -qE "android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)"; then
            echo "FAIL: the APK requests network access"
            exit 1
          fi
          echo "OK: no network permission in the packaged APK"

      # Actions artifacts need a logged-in GitHub session and arrive as a zip, which is
      # awkward on a phone. A release asset is a plain, direct .apk link instead. One
      # rolling tag, so the link stays the same across rebuilds.
      - name: Publish the APK as a rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=boom2local-latest
          {
            echo "Automatischer Build aus Commit \`${GITHUB_SHA}\`."
            echo
            echo "**Download:** \`boom2-local.apk\` unten unter *Assets*, oder direkt:"
            echo "<https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/boom2-local.apk>"
            echo
            echo "Pruefsumme in \`boom2-local.apk.sha256\`."
            echo "Auf dem Handy oeffnen und die Installation aus unbekannter Quelle bestaetigen."
            echo
            echo "Die Boom 2 muss vorher in den Android-Bluetooth-Einstellungen gekoppelt sein -"
            echo "die App sucht selbst nicht, damit sie ohne Standort-Berechtigung auskommt."
            echo
            echo "### Was dieser Build kann und was nicht"
            echo
            echo "- Die App hat **keine Netzwerk-Berechtigung**. Der Build-Schritt"
            echo "  *Show the permissions the APK actually requests* liest das aus diesem"
            echo "  APK zurueck und bricht ab, falls doch eine drinstuende."
            echo "- Das Steuerprotokoll der Boom 2 ist **unbestaetigt**: Anker dokumentiert"
            echo "  nichts, die Byte-Offsets stammen aus Mitschnitten verwandter Geraete."
            echo "  Verbinden und Status lesen sollten gehen; ob jeder Wert stimmt, ist offen."
            echo "  Jeder ungepruefte Wert ist in der App als *unbestaetigt* markiert, und der"
            echo "  Nur-Lesen-Modus ist absichtlich voreingestellt. Details in PROTOCOL.md."
            echo "- Signiert mit einem Debug-Schluessel, der zwischen den CI-Laeufen erhalten"
            echo "  bleibt: ein neuerer Build installiert sich als Update darueber."
          } > release-notes.md
          sha256sum boom2-local.apk > boom2-local.apk.sha256
          # Not a prerelease: that is what makes /releases/latest/download work and puts
          # the APK on the repository's front page. The notes carry the honesty instead.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --notes-file release-notes.md --prerelease=false --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Boom2 Local - Entwicklungsstand" \
              --notes-file release-notes.md --latest --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" boom2-local.apk boom2-local.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Direkter Download:"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/boom2-local.apk"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/boom2-local.apk"
          echo "SHA256: $(cat boom2-local.apk.sha256)"

      - uses: actions/upload-artifact@v4
        with:
          name: boom2-local-apk
          path: soundcore-boom2-local/boom2-local.apk
          if-no-files-found: error
